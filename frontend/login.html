<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar | Taylor Tech</title>
<meta name="theme-color" content="#090b10">

<link rel="icon" href="/assets/icons/icon.svg" type="image/svg+xml">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link rel="stylesheet" href="/assets/css/base.css">
<link rel="stylesheet" href="/assets/css/client.css">
<style>
  body.login-page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
  }
  .login-wrap { width: 100%; max-width: 420px; }
  .login-wrap .brand {
    display: flex; align-items: center; gap: 0.6rem; justify-content: center;
    margin-bottom: 1.6rem; font-weight: 800; font-size: 1.2rem;
  }
  .login-wrap .brand img { width: 40px; height: 40px; filter: drop-shadow(0 0 10px var(--neon-glow)); }
  .login-wrap .brand span.tech { color: var(--neon); }
  .erro-login {
    background: rgba(255,71,87,0.1); border: 1px solid rgba(255,71,87,0.3);
    color: var(--danger); padding: 0.7rem 1rem; border-radius: 10px;
    font-size: 0.85rem; margin-bottom: 1rem; display: none;
  }
  .login-wrap .dica {
    text-align: center; margin-top: 1rem; font-size: 0.78rem; color: var(--text-dim);
  }
</style>
</head>
<body class="login-page">

<div class="login-wrap">
  <div class="brand">
    <img src="/assets/icons/icon.svg" alt="Taylor Tech">
    <span>TAYLOR <span class="tech">TECH</span></span>
  </div>

  <form id="formLogin" class="form-card" novalidate>
    <h2><i class="fa-solid fa-lock"></i> Acessar Painel</h2>
    <p class="subtitle">Entre com seu e-mail e senha.</p>

    <div id="erroLogin" class="erro-login"></div>

    <div class="field">
      <label for="email">E-mail</label>
      <input type="email" id="email" required autocomplete="username">
    </div>

    <div class="field">
      <label for="senha">Senha</label>
      <input type="password" id="senha" required autocomplete="current-password">
    </div>

    <button type="submit" class="btn btn-primary btn-block" id="btnEntrar">Entrar</button>
  </form>

  <p class="dica">Acesso restrito à equipe Taylor Tech.</p>
</div>

<script src="/assets/js/api.js"></script>
<script src="/assets/js/login.js"></script>
</body>
</html>
